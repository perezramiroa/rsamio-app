<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSAMIO - Control de Stock Inmunizaciones</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .nivel-vista { transition: all 0.3s ease; }
        .map-container { position: relative; display: inline-block; border: 1px solid #dee2e6; border-radius: 10px; padding: 10px; background: white; }
        .img-fluid { max-width: 100%; height: auto; border-radius: 5px; }
        area { cursor: pointer; }
        .badge-stock { font-size: 1rem; padding: 0.5em 0.8em; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-3">
    <div class="card mb-3 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
            <h4 id="tituloNavegacion" class="text-primary mb-0">📍 Selección de Región - Provincia de Neuquén</h4>
            <div id="controles-navegacion">
                <button id="btnVolver" onclick="irANivel1()" class="btn btn-outline-secondary" style="display:none;">⬅ Volver al Mapa</button>
            </div>
        </div>
    </div>

    <div id="contenedor-principal">
        
        <div id="capa-mapas" class="nivel-vista text-center">
            <div class="map-container shadow-sm">
                <img id="imgMapaDinamica" src="" usemap="#mapaInteractivo" class="img-fluid">
                <map name="mapaInteractivo" id="mapaInteractivo">
                    </map>
            </div>
        </div>

        <div id="capa-datos" class="nivel-vista" style="display:none;">
            <div class="row">
                <div class="col-12">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                            <h5 id="nombre-establecimiento" class="mb-0">🏥 Establecimiento</h5>
                            <span class="badge badge-light" id="estado-conexion">Sincronizado</span>
                        </div>
                        <div class="card-body">
                            <h5>📦 Stock Actual</h5>
                            <div class="table-responsive mb-4">
                                <table class="table table-striped table-hover">
                                    <thead class="thead-dark">
                                        <tr>
                                            <th>Vacuna</th>
                                            <th>Laboratorio</th>
                                            <th>Lote</th>
                                            <th>Vencimiento</th>
                                            <th>Cantidad</th>
                                        </tr>
                                    </thead>
                                    <tbody id="cuerpoTablaStock">
                                        </tbody>
                                </table>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <h6>📥 Últimos Ingresos</h6>
                                    <table class="table table-sm table-bordered">
                                        <tbody id="cuerpoTablaIngresos"></tbody>
                                    </table>
                                </div>
                                <div class="col-md-6">
                                    <h6>📤 Últimos Egresos</h6>
                                    <table class="table table-sm table-bordered">
                                        <tbody id="cuerpoTablaEgresos"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // --- CONFIGURACIÓN DE IMÁGENES (COLOCAR AQUÍ TUS BASE64) ---
    const IMAGENES_MAPA = {
        PROVINCIA: "[COLOCAR_AQUÍ_BASE64_MAPA_PROVINCIAL]",
        CONFLUENCIA: "[COLOCAR_AQUÍ_BASE64_MAPA_CONFLUENCIA]",
        VACA_MUERTA: "[COLOCAR_AQUÍ_BASE64_MAPA_VACA_MUERTA]"
    };

    // --- LÓGICA DE NAVEGACIÓN ---
    function mostrarCapa(idCapa) {
        document.querySelectorAll('.nivel-vista').forEach(c => c.style.display = 'none');
        document.getElementById(idCapa).style.display = 'block';
    }

    function irANivel1() {
        document.getElementById('btnVolver').style.display = 'none';
        document.getElementById('tituloNavegacion').innerText = "📍 Selección de Región - Provincia de Neuquén";
        mostrarCapa('capa-mapas');
        renderizarMapaProvincial();
    }

    function renderizarMapaProvincial() {
        const img = document.getElementById('imgMapaDinamica');
        const mapa = document.getElementById('mapaInteractivo');
        img.src = IMAGENES_MAPA.PROVINCIA;
        
        mapa.innerHTML = `
            <area shape="rect" coords="35,401,311,429" alt="Confluencia" onclick="irANivel2('Confluencia')">
            <area shape="rect" coords="35,332,311,360" alt="Vaca Muerta" onclick="irANivel2('Vaca Muerta')">
        `;
    }

    function irANivel2(region) {
        const img = document.getElementById('imgMapaDinamica');
        const mapa = document.getElementById('mapaInteractivo');
        document.getElementById('btnVolver').style.display = 'inline-block';
        document.getElementById('tituloNavegacion').innerText = "📍 Región: " + region;

        if(region === 'Confluencia') {
            img.src = IMAGENES_MAPA.CONFLUENCIA;
            mapa.innerHTML = `
                <area shape="rect" coords="229,158,346,174" alt="Centenario" onclick="seleccionarLocalidad('Centenario')">
                <area shape="rect" coords="229,120,346,145" alt="Vista Alegre" onclick="seleccionarLocalidad('Vista Alegre')">
            `;
        } else if(region === 'Vaca Muerta') {
            img.src = IMAGENES_MAPA.VACA_MUERTA;
            mapa.innerHTML = `
                <area shape="rect" coords="333,204,469,227" alt="El Chañar" onclick="seleccionarLocalidad('San Patricio del Chañar')">
            `;
        }
    }

    // --- ETAPA 3: LÓGICA DE FILTRADO Y DATOS ---
    function seleccionarLocalidad(localidad) {
        document.getElementById('nombre-establecimiento').innerText = "🏥 Localidad: " + localidad;
        mostrarCapa('capa-datos');
        
        // Limpiar y mostrar cargando
        document.getElementById('cuerpoTablaStock').innerHTML = '<tr><td colspan="5" class="text-center">Consultando Stock General...</td></tr>';

        // LLAMADA AL SERVIDOR DE GOOGLE
        // Esta función debe existir en tu archivo .gs
        google.script.run
            .withSuccessHandler(function(response) {
                renderizarDatosCompletos(response, localidad);
            })
            .withFailureHandler(err => {
                alert("Error de comunicación con la base de datos.");
            })
            .obtenerDatosPorLocalidad(localidad);
    }

    function renderizarDatosCompletos(data, nombre) {
        const tablaStock = document.getElementById('cuerpoTablaStock');
        tablaStock.innerHTML = "";

        if (!data.stock || data.stock.length === 0) {
            tablaStock.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No se encontró stock cargado para ${nombre}.</td></tr>`;
        } else {
            data.stock.forEach(item => {
                tablaStock.innerHTML += `
                    <tr>
                        <td>${item.vacuna}</td>
                        <td>${item.laboratorio || 'N/A'}</td>
                        <td>${item.lote}</td>
                        <td>${new Date(item.vencimiento).toLocaleDateString()}</td>
                        <td><span class="badge badge-primary badge-stock">${item.stock}</span></td>
                    </tr>`;
            });
        }
        
        // Aquí podrías agregar el renderizado de Ingresos/Egresos similarmente
    }

    // Inicialización
    window.onload = irANivel1;
</script>

</body>
</html>
