/* ========================= */
/* CARGA INICIAL */
/* ========================= */

window.onload=function(){

cargarStock();
cargarRegiones();

}

/* ========================= */
/* CARGAR STOCK */
/* ========================= */

async function cargarStock(){

const data=await fetch(APPS_SCRIPT_URL+"?action=getStock").then(r=>r.json());

renderTabla(data,"tablaStock");

}

/* ========================= */
/* RENDER TABLAS */
/* ========================= */

function renderTabla(data,id){

const tabla=document.getElementById(id);

tabla.innerHTML="";

if(data.length==0)return;

let headers=Object.keys(data[0]);

let html="<tr>";

headers.forEach(h=>html+="<th>"+h+"</th>");

html+="</tr>";

data.forEach(row=>{

html+="<tr>";

headers.forEach(h=>{
html+="<td>"+row[h]+"</td>";
});

html+="</tr>";

});

tabla.innerHTML=html;

}

/* ========================= */
/* DASHBOARD */
/* ========================= */

function abrirDashboardRegional(){

document.getElementById("dashboardRegional").style.display="block";
document.getElementById("app").style.display="none";

cargarDashboard();

}

function cerrarDashboard(){

document.getElementById("dashboardRegional").style.display="none";
document.getElementById("app").style.display="block";

}

async function cargarDashboard(){

const stock=await fetch(APPS_SCRIPT_URL+"?action=getStockRegional").then(r=>r.json());
const ingresos=await fetch(APPS_SCRIPT_URL+"?action=getIngresosRegional").then(r=>r.json());
const egresos=await fetch(APPS_SCRIPT_URL+"?action=getEgresosRegional").then(r=>r.json());

renderTabla(stock,"tablaStockRegional");
renderTabla(ingresos,"tablaIngresosRegional");
renderTabla(egresos,"tablaEgresosRegional");

}

/* ========================= */
/* PDF */
/* ========================= */

function descargarPDF(id){

let element=document.getElementById(id);

let opt={
margin:1,
filename:'reporte_vacunas.pdf',
image:{type:'jpeg',quality:0.98},
html2canvas:{scale:2},
jsPDF:{unit:'in',format:'letter',orientation:'landscape'}
};

html2pdf().set(opt).from(element).save();

}

/* ========================= */
/* REGIONES */
/* ========================= */

async function cargarRegiones(){

const data=await fetch(APPS_SCRIPT_URL+"?action=getRegiones").then(r=>r.json());

const select=document.getElementById("filtroRegion");

data.forEach(r=>{

let option=document.createElement("option");

option.value=r.region;
option.text=r.region;

select.appendChild(option);

});

}

/* ========================= */
/* SELECCION REGION */
/* ========================= */

function seleccionarRegion(region){

document.getElementById("filtroRegion").value=region;

if(region=="Confluencia"){
document.getElementById("imagenMapa").src=MAPA_CONFLUENCIA_BASE64;
}

if(region=="Vaca Muerta"){
document.getElementById("imagenMapa").src=MAPA_VACAMUERTA_BASE64;
}

}
